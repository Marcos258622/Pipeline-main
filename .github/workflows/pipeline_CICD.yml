name: Pipeline Demo CI/CD

on:
  push:
    branches: [ "main" ]

jobs:

  qualidade:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.12'


      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Análise Estática (Linter)
        run: flake8 .
        

      - name: Teste unitários e cobertura minima
        run: pytest --cov=app --cov-fail-under=90
  
  docker:
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build com Docker Compose
        run: docker compose build

      - name: Push com Docker Compose
        run: docker compose push calculadora-app

  test-docker:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Subir ambiente de teste
        run: docker compose up -d

      - name: Validar comunicação (ping)
        run: docker compose exec -T calculadora-app ping -c 1 servico-vizinho

  deploy:
      needs: [test-docker]
      runs-on: ubuntu-latest
      
      steps:
        - run: echo "Deploy Enviado"
