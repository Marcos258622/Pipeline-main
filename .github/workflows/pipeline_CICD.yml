name: Pipeline Demo CI/CD

on:
  push:
    branches: [ "main" ]

jobs:

  qualidade:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.12'


      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Análise Estática (Linter)
        run: flake8 .
        

      - name: Teste unitários e cobertura minima
        run: pytest --cov=app --cov-fail-under=90
  
  docker:
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4


      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}


      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_USER }}/pipeline-ci:latest

  test-docker:
    needs: docker
    runs-on: ubuntu-latest 
    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Rodar testes dentro do Container
        run: docker run ${{ vars.DOCKER_USER }}/pipeline-ci:latest pytest

  deploy:
    needs: [test-docker]
    runs-on: ubuntu-latest
    
    steps:
      - run: echo "Deploy Enviado"
