services:
  # Serviço da calculadora (o nosso código)
  calculadora-app:
    build: .
    image: marcosvinirocha/pipeline-main:latest
    # O app.py só define funções e termina na hora; este comando mantém o contêiner no ar
    command: sleep infinity
    depends_on:
      - db

  # Serviço auxiliar (o nosso vizinho de teste)
  servico-vizinho:
    image: alpine
    command: sleep infinity

  # Banco de dados MariaDB
  db:
    image: mariadb:10.6
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: fatec_password
      MYSQL_DATABASE: wordpress
      MYSQL_USER: user_fatec
      MYSQL_PASSWORD: password_fatec
    volumes:
      - db_data:/var/lib/mysql

  # WordPress (depende do banco)
  wordpress:
    image: wordpress:latest
    restart: always
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: user_fatec
      WORDPRESS_DB_PASSWORD: password_fatec
      WORDPRESS_DB_NAME: wordpress

volumes:
  db_data: